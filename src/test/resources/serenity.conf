serenity {
    take.screenshots = FOR_FAILURES
}
# https://github.com/serenity-bdd/serenity-documentation/blob/master/src/asciidoc/screenshots.adoc

headless.mode = false


# run with mvn clean verify -Dwebdriver=chrome
webdriver {
  driver="edge"

  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless", "--window-size=1000,800"
                  "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
          }
        }
    }
  }
  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless",
                  "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
   }
   firefox {
     webdriver {
       capabilities {
         browserName = "firefox"
         pageLoadStrategy = "normal"
         acceptInsecureCerts = true
         unhandledPromptBehavior = "dismiss"
         strictFileInteractability = true
         "moz:firefoxOptions" {
           args = ["-headless"],
           prefs {
             "javascript.options.showInConsole": false
           },
           log {"level": "info"},
         }
       }
     }
   }
}



#
# This section defines environment-specific configuration for different environments.
# You can define normal Serenity properties, such as webdriver.base.url, or custom ones
# You can find more details about this feature at https://johnfergusonsmart.com/environment-specific-configuration-in-serenity-bdd/
#

environments {
  default {
    api.base.url = "https://api-v1.practicesoftwaretesting.com"
    webdriver.base.url = "https://v1.practicesoftwaretesting.com"
  }
  dev {
    api.base.url = "http://localhost:8091"
    webdriver.base.url = "http://localhost:4200"
  }
  prod {
    api.base.url = "https://api-v1.practicesoftwaretesting.com"
    webdriver.base.url = "https://v1.practicesoftwaretesting.com"
  }
}