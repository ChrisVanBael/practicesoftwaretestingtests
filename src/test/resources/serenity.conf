serenity {
    take.screenshots = FOR_FAILURES
}
# https://github.com/serenity-bdd/serenity-documentation/blob/master/src/asciidoc/screenshots.adoc

headless.mode = false


# If you set a webdriver driver, Serenity-BDD will automatically select the browser you've set
# See https://serenity-bdd.github.io/docs/guide/driver_config#configuring-chromedriver-arguments
webdriver {
  #driver="edge"
  #driver="chrome"
  driver="firefox"
}



#
# This section defines environment-specific configuration for different environments.
# You can define normal Serenity properties, such as webdriver.base.url, or custom ones
# You can find more details about this feature at https://johnfergusonsmart.com/environment-specific-configuration-in-serenity-bdd/
#
environments {

  default {
    api.base.url = "https://api.practicesoftwaretesting.com"
    webdriver.base.url = "https://practicesoftwaretesting.com"
  }
  dev {
    api.base.url = "http://localhost:8091"
    webdriver.base.url = "http://localhost:4200"
  }
  prod {
    api.base.url = "https://api.practicesoftwaretesting.com"
    webdriver.base.url = "https://practicesoftwaretesting.com"
  }
}